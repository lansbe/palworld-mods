name: Verify
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: brew install lua
      - name: Check source
        run: python3 scripts/verify.py
      - name: Build
        run: |
          python3 scripts/build.py
          xcrun clang -target arm64-apple-macos14.0 -Wall -Wextra -Werror -c src/launcher/UpdateKeychain.c -o build/update-keychain.o
          xcrun swiftc -target arm64-apple-macos14.0 -swift-version 5 -warnings-as-errors -import-objc-header src/launcher/UpdateKeychain.h build/update-keychain.o -framework AppKit -framework CryptoKit -framework Security src/update/*.swift src/launcher/*.swift -o build/launcher-check
          xcrun swiftc -swift-version 5 -warnings-as-errors -framework AppKit -framework CryptoKit src/update/*.swift src/update-installer/main.swift -o build/installer-check
          xcrun swift scripts/assets.swift build/distribution-assets
          xcrun iconutil --convert icns build/distribution-assets/AppIcon.iconset --output build/distribution-assets/AppIcon.icns
      - name: Test
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          lua tests/extensions.lua
          lua tests/settings.lua
          lua tests/text_field.lua
          lua tests/localization.lua
          lua tests/tree.lua
          lua tests/updates.lua
          python3 scripts/test_updates.py
